<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HESED Studio — Admin Control Panel</title>
    
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-dark: #0f1115;
            --card-dark: #181b21;
            --border-dark: #2a2e37;
            --text-bright: #f3f4f6;
            --text-dim: #9ca3af;
            --accent-color: #d97757;
            --accent-hover: #c56546;
            --danger-color: #ef4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-bright); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }

        .admin-card { background: var(--card-dark); border: 1px solid var(--border-dark); border-radius: 16px; padding: 2.5rem; width: 100%; max-width: 440px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        .admin-title { font-size: 1.5rem; font-weight: 600; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.75rem; }
        .admin-subtitle { color: var(--text-dim); font-size: 0.875rem; margin-bottom: 2rem; }

        .form-group { margin-bottom: 1.25rem; }
        .form-label { display: block; font-size: 0.8rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); margin-bottom: 0.5rem; }
        .form-input { width: 100%; padding: 0.85rem 1rem; background: #0b0c0e; border: 1px solid var(--border-dark); border-radius: 8px; color: #ffffff; font-size: 0.95rem; outline: none; transition: border-color 0.2s; }
        .form-input:focus { border-color: var(--accent-color); }

        .btn-submit { width: 100%; padding: 0.85rem; background: var(--accent-color); color: #ffffff; border: none; border-radius: 8px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: background 0.2s; margin-top: 0.5rem; }
        .btn-submit:hover { background: var(--accent-hover); }

        .alert-banner { display: none; padding: 1rem; background: rgba(239, 68, 68, 0.1); border: 1px solid var(--danger-color); border-radius: 10px; color: #fca5a5; font-size: 0.85rem; margin-bottom: 1.5rem; word-break: break-all; }
        .alert-banner.active { display: block; }
    </style>
</head>
<body>

    <div class="admin-card" id="authCard">
        <h1 class="admin-title"><i class="fa-solid fa-shield-halved" style="color: var(--accent-color);"></i> Studio Admin</h1>
        <p class="admin-subtitle">이 페이지는 HESED 스튜디오 관리자 전용 인증 페이지입니다.</p>

        <div class="alert-banner" id="errorBanner"></div>

        <form id="magicLinkForm">
            <div class="form-group">
                <label class="form-label" for="emailInput">Authorized Email</label>
                <input type="email" id="emailInput" class="form-input" placeholder="andrew@hesed.studio" required autocomplete="email">
            </div>
            <button type="submit" class="btn-submit" id="submitBtn">Magic Link 발송</button>
        </form>
        <div id="statusMsg" style="margin-top: 1.2rem; font-size: 0.85rem; text-align: center; color: var(--text-dim);"></div>
    </div>

    <script>
        // IMPORTANT: Replace these variables with your actual credentials from your Supabase Dashboard
        const SUPABASE_URL = 'https://your-supabase-project.supabase.co';
        const SUPABASE_ANON_KEY = 'your-anon-key';

        let supabase = null;
        const errorBanner = document.getElementById('errorBanner');

        function showError(msg) {
            errorBanner.innerText = msg;
            errorBanner.classList.add('active');
        }

        function clearError() {
            errorBanner.innerText = '';
            errorBanner.classList.remove('active');
        }

        // Initialize Supabase client safely
        function initSupabase() {
            try {
                if (window.supabase && typeof window.supabase.createClient === 'function') {
                    if (SUPABASE_URL !== 'https://grgqrsaubwwgxcdmrbea.supabase.co' && SUPABASE_ANON_KEY !== 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdyZ3Fyc2F1Ynd3Z3hjZG1yYmVhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxODI4MTEsImV4cCI6MjEwNzc1ODgxMX0.ROo41s44sR3W901xROaSRz7H5Fmq45uTEIhYeVifT2s') {
                        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                        clearError();
                    } else {
                        showError("⚠️ Supabase 설정 필요: admin.html 파일 상단의 SUPABASE_URL 과 SUPABASE_ANON_KEY 값을 실 프로젝트 값으로 교체해 주세요.");
                    }
                } else {
                    showError("⚠️ Supabase SDK 로드 실패: 스크립트 연결 상태 및 외부 네트워크를 점검해 주세요.");
                }
            } catch (err) {
                showError("초기화 오류 발생: " + err.message);
            }
        }

        document.addEventListener('DOMContentLoaded', initSupabase);

        document.getElementById('magicLinkForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('emailInput').value.trim();
            const statusMsg = document.getElementById('statusMsg');

            if (!supabase) {
                showError("Supabase 연동이 완료되지 않았습니다. URL 및 Key 설정을 먼저 확인해 주세요.");
                return;
            }

            statusMsg.innerText = "인증 링크를 전송하는 중...";

            try {
                const { error } = await supabase.auth.signInWithOtp({ 
                    email,
                    options: { emailRedirectTo: window.location.href }
                });

                if (error) {
                    statusMsg.innerText = "";
                    showError("요청 실패: " + error.message);
                } else {
                    clearError();
                    statusMsg.innerText = `${email} (으)로 Magic Link가 전송되었습니다! 이메일함을 확인해 주세요.`;
                }
            } catch (err) {
                statusMsg.innerText = "";
                showError("처리 도중 예외가 발생했습니다: " + err.message);
            }
        });
    </script>
</body>
</html>
